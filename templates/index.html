<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <style>
      body {
        font-family: 'Helvetica', sans-serif;
        background-image: url('image/todopic.jpg'); /* Replace with your nature image URL */
        background-size: cover;
        background-position: center;
        margin: 0;
        padding: 20px;
        color: #333;
      }

      .container {
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background-color: rgba(255, 255, 255, 0.8);
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        color: #4caf50;
        margin-bottom: 20px;
        font-size: 2.5em;
      }

      form {
        margin-bottom: 30px;
        text-align: center;
      }

      input[type="text"] {
        padding: 12px;
        width: 80%;
        border: 1px solid #ddd;
        border-radius: 6px;
        margin-right: 10px;
        font-size: 16px;
      }

      input[type="submit"] {
        background-color: #4caf50;
        color: white;
        padding: 12px 18px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      input[type="submit"]:hover {
        background-color: #45a049;
      }

      ul {
        list-style-type: none;
        padding: 0;
      }

      li {
        background-color: #f9f9f9;
        margin-bottom: 10px;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .task-text {
        margin: 0;
        font-size: 1.2em;
      }

      .delete-btn {
        background-color: #ff4444;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .delete-btn:hover {
        background-color: #cc0000;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Todo App: Stay Organized!</h1>

      <!-- Add Task Form -->
      <form method="post">
        <input type="text" name="task_content" placeholder="Enter a new task" required />
        <input type="submit" name="add_task" value="Add Task" />
      </form>

      <!-- Display Tasks -->
      <h2>Your Tasks:</h2>
      <ul>
        {% for id, task in tasks.items() %}
        <li>
          <span class="task-text">{{ task }}</span>
          <form method="post" style="display: inline">
            <input type="hidden" name="task_id_to_delete" value="{{ id }}" />
            <input type="submit" name="delete_task" class="delete-btn" value="Delete" />
          </form>
        </li>
        {% endfor %}
      </ul>
    </div>
  </body>
</html>
